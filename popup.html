<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1 data-i18n="popupTitle"></h1>
  <label class="row">
    <span>
      <strong data-i18n="readingLabel"></strong>
      <small data-i18n="readingDesc"></small>
    </span>
    <input type="checkbox" id="reading" />
  </label>
  <label class="row">
    <span>
      <strong data-i18n="listLabel"></strong>
      <small data-i18n="listDesc"></small>
    </span>
    <input type="checkbox" id="list" />
  </label>
  <label class="row">
    <span>
      <strong data-i18n="boldLabel"></strong>
      <small data-i18n="boldDesc"></small>
    </span>
    <input type="checkbox" id="bold" />
  </label>
  <label class="row">
    <span>
      <strong data-i18n="langLabel"></strong>
    </span>
    <select id="lang">
      <option value="auto" data-i18n="langAuto"></option>
      <option value="ja">日本語</option>
      <option value="en">English</option>
    </select>
  </label>
  <p class="note" data-i18n="note"></p>
  <script src="popup.js"></script>
</body>
</html>
