<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1>差出人アドレス表示</h1>
  <label class="row">
    <span>
      <strong>開いたメール</strong>
      <small>閲覧ウィンドウの差出人名の右に表示</small>
    </span>
    <input type="checkbox" id="reading" />
  </label>
  <label class="row">
    <span>
      <strong>メール一覧</strong>
      <small>受信トレイ各行の差出人名の右に表示</small>
    </span>
    <input type="checkbox" id="list" />
  </label>
  <p class="note">アドレスをクリックするとコピーできます。</p>
  <script src="popup.js"></script>
</body>
</html>
